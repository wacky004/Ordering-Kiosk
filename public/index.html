<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#da291c" />
    <title>McDonald's Kiosk</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23da291c'/><path d='M12 94 L12 46 C12 22 18 8 33 8 C43 8 48 26 50 46 C52 26 57 8 67 8 C82 8 88 22 88 46 L88 94 L74 94 L74 46 C74 30 70 20 66 20 C60 20 57 36 56 54 L56 94 L44 94 L44 54 C43 36 40 20 34 20 C30 20 26 30 26 46 L26 94 Z' fill='%23ffc72c'/></svg>"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mcdo.theme') || 'kiosk';
          var layout = localStorage.getItem('mcdo.layout') || 'auto';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-layout', layout);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'kiosk');
        }
      })();
    </script>
    <script>
      // Boot guard: show a readable message instead of a blank page.
      (function () {
        window.__kioskReady = false;
        function showBootError(detail) {
          if (window.__kioskReady) return;
          var host = document.getElementById('bootFallback');
          if (!host) {
            host = document.createElement('div');
            host.id = 'bootFallback';
            host.className = 'boot-fallback';
            document.body.appendChild(host);
          }
          host.innerHTML =
            '<div class="boot-fallback__card">' +
            '<div class="spinner"></div>' +
            '<h2>Something went wrong loading the kiosk</h2>' +
            '<p class="hint" id="bootDetail"></p>' +
            '<p class="hint">Press <strong>Ctrl+Shift+R</strong> (hard refresh) to clear a stale cache. ' +
            'If you opened this file directly, use <code>dist/index.html</code> instead of <code>public/index.html</code>.</p>' +
            '<button class="btn btn--primary" type="button" onclick="location.reload()">Reload</button>' +
            '</div>';
          document.getElementById('bootDetail').textContent = detail || '';
        }
        window.__showBootError = showBootError;
        window.addEventListener('error', function (event) {
          var message = event && event.message ? event.message : 'A file failed to load.';
          if (event && event.filename) {
            message += ' (' + event.filename.split('/').pop() + ':' + event.lineno + ')';
          }
          showBootError(message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason ? event.reason.message || String(event.reason) : '';
          showBootError('Startup error: ' + reason);
        });
        setTimeout(function () {
          if (!window.__kioskReady) showBootError('The app did not start within 10 seconds.');
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="header"></div>
    <main id="app" class="app">
      <div class="boot-fallback" id="bootFallback">
        <div class="boot-fallback__card">
          <div class="spinner"></div>
          <p class="hint">Loading the kiosk…</p>
        </div>
      </div>
    </main>
    <div id="modal-root"></div>
    <div class="toast-wrap" id="toastWrap"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/live.js"></script>
    <script src="js/views/view-home.js"></script>
    <script src="js/views/view-platforms.js"></script>
    <script src="js/views/view-menu.js"></script>
    <script src="js/views/view-checkout.js"></script>
    <script src="js/views/view-orders.js"></script>
    <script src="js/views/view-order.js"></script>
    <script src="js/views/view-receipt.js"></script>
    <script src="js/views/view-points.js"></script>
    <script src="js/views/view-auth.js"></script>
    <script src="js/views/view-admin.js"></script>
    <script src="js/views/view-kitchen.js"></script>
    <script src="js/views/view-credits.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
